services:
  whisper-cpp:
    build:
      context: ./docker/whisper-cpp
      args:
        CUDA_ARCH: "${CUDA_ARCH:-86}"
        WHISPER_CPP_REF: "${WHISPER_CPP_REF:-master}"
    image: interview-transcriber/whisper-cpp:cuda
    container_name: whisper-cpp
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WHISPER_CPP_HOST_PORT:-8089}:8081"
    volumes:
      - "${WHISPER_MODELS_DIR:-./models}:/models:ro"
    environment:
      WHISPER_MODEL: "/models/${WHISPER_GGML_MODEL:-ggml-large-v3-turbo.bin}"
      WHISPER_PORT: "8081"
      WHISPER_THREADS: "${WHISPER_THREADS:-4}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
